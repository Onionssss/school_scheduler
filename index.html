      .pl-root {

      }
      .pl-root .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      .pl-topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
      .pl-brand { font-size:14px; font-weight:600; color:var(--soft); display:inline-flex; align-items:baseline; }
      .school-input {

        background: transparent; border: none; border-bottom: 1px dashed #C7CDD4;

      }
      .school-input::placeholder { color: #B7BEC7; }
      .school-input:hover { border-bottom-color: var(--soft); }
      .school-input:focus { border-bottom-color: var(--accent); border-bottom-style: solid; }
      .pl-tabs { display:flex; gap:4px; background:#E7E9EC; padding:3px; border-radius:8px; }
      .pl-tab { display:inline-flex; align-items:center; gap:5px; border:none; background:transparent; color:var(--soft);

      .pl-tab.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
      .pl-loading { color:var(--soft); font-size:13px; padding:32px 0; }
      .pl-headrow { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
      .chip { display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:4px 9px; border-radius:5px;

      .chip.warn { background:var(--warn-soft); color:var(--warn); }

      .toolbar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
      .btn-primary { display:inline-flex; align-items:center; gap:5px; background:var(--ink); color:#fff; border:none;
        padding:8px 13px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
      .btn-primary:hover { background:#2c323a; }
      .btn-ghost { display:inline-flex; align-items:center; gap:5px; background:transparent; border:1px solid var(--line);
        color:var(--soft); padding:7px 11px; border-radius:6px; font-size:13px; cursor:pointer; font-family:inherit; }
      .btn-ghost:hover { border-color:var(--soft); color:var(--ink); }
      .btn-danger { background:var(--warn); color:#fff; border:none; padding:7px 11px; border-radius:6px; font-size:13px; cursor:pointer; font-family:inherit; }
      .btn-ghost.sm, .btn-danger.sm, .btn-primary.sm { padding:3px 7px; font-size:11px; }
      .icon-btn { border:none; background:transparent; color:var(--soft); cursor:pointer; padding:3px; border-radius:4px; flex-shrink:0; }
      .icon-btn:hover { color:var(--warn); }
      .confirm-row { display:inline-flex; gap:4px; align-items:center; }
      .hint { font-size:12px; color:var(--soft); }
      .empty { color:var(--soft); font-size:13px; text-align:center; padding:26px 0; }
      .footnote { color:var(--soft); font-size:11px; margin-top:10px; line-height:1.6; }
      .save-error { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--warn-soft); color:var(--warn);
        border:1px solid var(--warn); border-radius:8px; padding:8px 12px; font-size:12px; margin-bottom:12px; }

      .termtabs { display:flex; gap:4px; overflow-x:auto; margin-bottom:12px; }
      .termtab { flex:0 0 auto; padding:8px 16px; border-radius:20px; font-size:13px; border:1px solid var(--line);
