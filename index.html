      });
    },
  };

      .pl-root {
        --bg: #F2F3F5; --surface: #FFFFFF; --ink: #14171C; --soft: #5A6371;

        background: var(--bg); color: var(--ink); min-height: 100%;
        padding: 16px; box-sizing: border-box;
      }
      .pl-root .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      .pl-topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
      .pl-brand { font-size:14px; font-weight:600; color:var(--soft); display:inline-flex; align-items:baseline; }
      .school-input {
        font-family: inherit; font-size: inherit; font-weight: inherit; color: var(--ink);
        background: transparent; border: none; border-bottom: 1px dashed #C7CDD4;
        width: 5.5em; padding: 0 1px 1px; outline: none; text-align: left;
      }
      .school-input::placeholder { color: #B7BEC7; }
      .school-input:hover { border-bottom-color: var(--soft); }
      .school-input:focus { border-bottom-color: var(--accent); border-bottom-style: solid; }
      .pl-tabs { display:flex; gap:4px; background:#E7E9EC; padding:3px; border-radius:8px; }
      .pl-tab { display:inline-flex; align-items:center; gap:5px; border:none; background:transparent; color:var(--soft);
        padding:7px 14px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
      .pl-tab.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
      .pl-loading { color:var(--soft); font-size:13px; padding:32px 0; }
      .pl-headrow { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
      .chip { display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:4px 9px; border-radius:5px;
        background:var(--accent-soft); color:var(--accent); }
      .chip.warn { background:var(--warn-soft); color:var(--warn); }
      .chip.neutral { background:#E5E8EB; color:var(--soft); }
      .toolbar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
      .btn-primary { display:inline-flex; align-items:center; gap:5px; background:var(--ink); color:#fff; border:none;
        padding:8px 13px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
      .btn-primary:hover { background:#2c323a; }
      .btn-ghost { display:inline-flex; align-items:center; gap:5px; background:transparent; border:1px solid var(--line);
        color:var(--soft); padding:7px 11px; border-radius:6px; font-size:13px; cursor:pointer; font-family:inherit; }
      .btn-ghost:hover { border-color:var(--soft); color:var(--ink); }
      .btn-danger { background:var(--warn); color:#fff; border:none; padding:7px 11px; border-radius:6px; font-size:13px; cursor:pointer; font-family:inherit; }
      .btn-ghost.sm, .btn-danger.sm, .btn-primary.sm { padding:3px 7px; font-size:11px; }
      .icon-btn { border:none; background:transparent; color:var(--soft); cursor:pointer; padding:3px; border-radius:4px; flex-shrink:0; }
      .icon-btn:hover { color:var(--warn); }
      .confirm-row { display:inline-flex; gap:4px; align-items:center; }
      .hint { font-size:12px; color:var(--soft); }
      .empty { color:var(--soft); font-size:13px; text-align:center; padding:26px 0; }
      .footnote { color:var(--soft); font-size:11px; margin-top:10px; line-height:1.6; }
      .save-error { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--warn-soft); color:var(--warn);
        border:1px solid var(--warn); border-radius:8px; padding:8px 12px; font-size:12px; margin-bottom:12px; }

      .termtabs { display:flex; gap:4px; overflow-x:auto; margin-bottom:12px; }
      .termtab { flex:0 0 auto; padding:8px 16px; border-radius:20px; font-size:13px; border:1px solid var(--line);
        background:var(--surface); color:var(--soft); cursor:pointer; font-family:inherit; }
      .termtab.on { background:var(--ink); color:#fff; border-color:var(--ink); }

      /* \u8AB2\u8868\u6C38\u9060\u662F\u540C\u4E00\u5F35\u6574\u9AD4\u8868\u683C\uFF1B\u5BB9\u5668\u4E0D\u5920\u5BEC\u6642\u6A6B\u5411\u6372\u52D5\uFF0C\u4E0D\u6703\u5207\u6210\u624B\u6A5F\u7248\u6216\u64E0\u58DE\u6587\u5B57\u3002 */
      .grid-wrap { display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; }
      .grid-table { display:grid; grid-template-columns:74px repeat(${gn}, 1fr);
        min-width:640px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface); }
      .gcorner, .ghead { background:#FAFAFA; border-bottom:1px solid var(--line); border-right:1px solid var(--line);
        font-size:12px; font-weight:600; color:var(--soft); padding:9px 4px; text-align:center; }
      .ghead:last-child { border-right:none; }
      .pcol { display:flex; flex-direction:column; border-right:1px solid var(--line); }
      .pcell { height:${Ir}px; display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:1px; border-bottom:1px solid #EFF0F2; }
      .ptime { font-size:9.5px; color:#9AA3AE; }
      .pnum { font-size:13px; font-weight:700; color:var(--ink); }
      .dcol { position:relative; border-right:1px solid var(--line); }
      .dcol:last-child { border-right:none; }
      .rline { height:${Ir}px; border-bottom:1px solid #EFF0F2; }
      .block { position:absolute; border-radius:6px; padding:6px 8px; font-size:12px; line-height:1.35; overflow:hidden;
        border-left:3px solid var(--accent); background:var(--accent-soft); cursor:pointer; box-sizing:border-box; }
      .block.conflict { border-left-color:var(--warn); background:var(--warn-soft); background-image:var(--stripe); }
      .bname { font-weight:700; }
      .bmeta { color:var(--soft); display:flex; align-items:center; gap:3px; margin-top:2px; font-size:11px; }
      .accent-teal{--accent:#146B5C;--accent-soft:#DCEEE9;} .accent-blue{--accent:#2B5B8C;--accent-soft:#DEE7F2;}
      .accent-plum{--accent:#6B3E6E;--accent-soft:#EBE0EC;} .accent-amber{--accent:#8A5A2B;--accent-soft:#F0E3D3;}

      .btags { display:flex; gap:4px; margin-top:2px; flex-wrap:wrap; }

      .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; }
      .card-title { font-size:13px; font-weight:700; margin-bottom:12px; }

      .bigno .slash { font-size:16px; color:var(--soft); font-weight:500; }

      .bar.sm { height:6px; margin-top:6px; }
      .bar-done { background:var(--ink); }
      .bar-plan { background:#A9B2BD; }
      .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--soft); margin-top:8px; }
      .legend span { display:inline-flex; align-items:center; gap:4px; }
      .sw { width:9px; height:9px; border-radius:2px; display:inline-block; }
      .sw.done { background:var(--ink); } .sw.plan { background:#A9B2BD; }
      .catrow { margin-bottom:12px; }
      .coursehint { font-size:11px; color:var(--accent); margin-top:4px; }
